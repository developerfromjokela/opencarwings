{% extends 'ui/base.html' %}
{% load i18n %}

{% block title %}
{% translate "404 Not Found" %}
{% endblock %}

{% block content %}
<div class="max-w-6xl mx-auto py-10 px-4 flex flex-col align-center justify-center items-center">
    <h2 class="text-2xl font-semibold text-gray-800 dark:text-gray-100 mb-2 text-center">{% translate "404 Not Found" %}</h2>
    <p class="text-center text-gray-500 dark:text-gray-300 mb-6 text-sm">{% translate "Requested resource was not found." %}</p>
    <a href="/" class="text-white bg-blue-700 hover:bg-blue-800 focus:ring-4 focus:ring-blue-300 font-medium rounded-lg text-sm px-4 py-2">{% translate "Back" %}</a>
</div>
{% endblock %}
